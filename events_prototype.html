let selectedCat = 'all';
let selectedRow = null;
let searchVal = '';
let statusVal = 'all';
let initiatorVal = 'all';

function statusBadge(s) {
  if(s==='success') return '<span class="badge badge-success">Успішно</span>';
  if(s==='error') return '<span class="badge badge-danger">Помилка</span>';
  if(s==='pending') return '<span class="badge badge-warning">В процесі</span>';
  if(s==='canceled') return '<span class="badge badge-neutral">Скасовано</span>';
  return '';
}
function initiatorLabel(i) {
  if(i==='client') return '<span class="initiator-label">Клієнт</span>';
  if(i==='employee') return '<span class="initiator-label">Співробітник</span>';
  if(i==='system') return '<span class="initiator-label">Система</span>';
  return i;
}
function getFiltered() {
  return EVENTS.filter(e => {
    if(selectedCat !== 'all' && e.cat !== selectedCat) return false;
    if(statusVal !== 'all' && e.status !== statusVal) return false;
    if(initiatorVal !== 'all' && e.initiator !== initiatorVal) return false;
    if(searchVal && !e.id.toLowerCase().includes(searchVal) && !e.desc.toLowerCase().includes(searchVal) && !e.type.toLowerCase().includes(searchVal)) return false;
    return true;
  });
}
function render() {
  const filtered = getFiltered();
  const tbody = document.getElementById('eventsBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('countBadge').textContent = filtered.length + ' подій';
  document.getElementById('s-total').textContent = EVENTS.length;
  document.getElementById('s-success').textContent = EVENTS.filter(e=>e.status==='success').length;
  document.getElementById('s-errors').textContent = EVENTS.filter(e=>e.status==='error').length;
  document.getElementById('s-pending').textContent = EVENTS.filter(e=>e.status==='pending').length;
  if(filtered.length === 0) { tbody.innerHTML = ''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(e => {
    const cat = CATS[e.cat];
    const sel = selectedRow && selectedRow.id === e.id ? 'selected' : '';
    return `<tr class="${sel}" data-id="${e.id}">
      <td class="nowrap" style="color:var(--color-text-secondary);font-size:12px">${e.ts}</td>
      <td class="nowrap"><span class="cat-dot ${cat.cls}"></span>${cat.label}</td>
      <td class="nowrap">${e.type}</td>
      <td style="color:var(--color-text-secondary);font-size:12px;max-width:200px">${e.desc}</td>
      <td class="nowrap">${initiatorLabel(e.initiator)}</td>
      <td class="nowrap" style="font-size:12px;color:var(--color-text-secondary)">${e.channel}</td>
      <td class="nowrap">${statusBadge(e.status)}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const ev = EVENTS.find(e=>e.id===tr.dataset.id);
      if(ev) openDetail(ev);
    });
  });
}
function openDetail(ev) {
  selectedRow = ev;
  render();
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');
  document.getElementById('d-title').textContent = ev.type;
  document.getElementById('d-subtitle').textContent = ev.id + ' · ' + ev.ts;
  const cat = CATS[ev.cat];
  let html = `<div>
    <div class="detail-section-title">Загальні поля</div>
    <div class="kv-row"><div class="kv-key">Статус</div><div class="kv-val">${statusBadge(ev.status)}</div></div>
    <div class="kv-row"><div class="kv-key">Категорія</div><div class="kv-val"><span class="cat-dot ${cat.cls}"></span>${cat.label}</div></div>
    <div class="kv-row"><div class="kv-key">Ініціатор</div><div class="kv-val">${initiatorLabel(ev.initiator)}</div></div>
    <div class="kv-row"><div class="kv-key">Канал</div><div class="kv-val">${ev.channel}</div></div>
  </div>`;
  html += `<div class="detail-section">
    <div class="detail-section-title">Деталі події</div>
    ${ev.fields.map(([k,v])=>`<div class="kv-row"><div class="kv-key">${k}</div><div class="kv-val">${v}</div></div>`).join('')}
  </div>`;
  if(ev.related && ev.related.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Пов'язані події</div>
      ${ev.related.map(r=>`<div class="related-item"><div class="related-dot"></div><div><div class="related-text">${r.t}</div><div class="related-time">${r.ts}</div></div></div>`).join('')}
    </div>`;
  }
  html += `<div class="detail-section">
    <div class="detail-section-title">JSON payload</div>
    <div class="json-block">${ev.json}</div>
  </div>`;
  document.getElementById('detailBody').innerHTML = html;
}
document.getElementById('detailClose').addEventListener('click', () => {
  document.getElementById('detailPanel').classList.add('hidden');
  selectedRow = null;
  render();
});
document.getElementById('catSelect').addEventListener('change', e => { selectedCat = e.target.value; selectedRow = null; document.getElementById('detailPanel').classList.add('hidden'); render(); });
document.getElementById('searchInput').addEventListener('input', e => { searchVal = e.target.value.toLowerCase(); render(); });
document.getElementById('statusSelect').addEventListener('change', e => { statusVal = e.target.value; render(); });
document.getElementById('initiatorSelect').addEventListener('change', e => { initiatorVal = e.target.value; render(); });
render();
</script>
</body>
</html>
