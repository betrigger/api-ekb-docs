      description: Отримує список всіх заявок з можливістю фільтрації та пагінації. Підтримує фільтрацію за типом, статусом, пріоритетом, клієнтом, датами створення, призначеною групою та необхідною дією. Повертає масив заявок з повною інформацією про кожну заявку, включно з клієнтськими даними, статусами та активними ордерами.
