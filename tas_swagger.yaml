      summary: Delete Document
      description: Видаляє документ клієнта за його ID. Операція незворотна. Використовується для видалення застарілих, недійсних або помилково створених документів.
      tags: [API/Documents]
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema: {type: string}
      responses:
        '200': {description: Successful response}
