      tags: [API/Documents]
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {default: '', description: '', type: string}
                status: {default: '', description: '', type: string}
                channel: {default: '', description: '', type: string}
                source: {default: '', description: '', type: string}
                owner: {default: '', description: '', type: object}
                signature:
                  default: ''
                  description: ''
                  type: array
                  items: {type: string}
                data: {default: '', description: '', type: object}
                is_primary: {default: '', description: '', type: boolean}
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  owner: {type: object}
                  data: {type: object}
                  is_primary: {type: boolean}
                  signature: {type: array, items: {type: object}}
                  channel: {type: string}
                  created_at: {type: string, format: date-time}
                  source: {type: string}
                  type: {type: string}
                  updated_at: {type: string, format: date-time}
                  company_client_id: {type: string, format: uuid}
                  status: {type: string}
              example:
                id: "6aa72d48-c026-4a7a-b86b-3703d9cea8d2"
                owner:
                  id: "545962e5-4f87-4d44-8fa7-6fd5be278d1d"
