  /applications:
    post:
      summary: Create Application
      description: Створює нову заявку в системі. Приймає обов'язкові параметри - тип заявки, статус, пріоритет та ID клієнта з ЕКБ. Опціонально можна передати ім'я клієнта, ІПН та телефон. Після створення повертає повну інформацію про заявку з автоматично згенерованим номером. Використовується при створенні нових заявок на онбординг або інші процеси.
      tags: [API/Applications]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type_id: {default: '', description: '', type: string}
                status_id: {default: '', description: '', type: string}
                priority_id: {default: '', description: '', type: string}
                ekb_client_id: {default: '', description: '', type: string}
                client_name: {default: '', description: '', type: string}
                client_tax_id: {default: '', description: '', type: string}
                client_phone: {default: '', description: '', type: string}
              required: [type_id, status_id, priority_id, ekb_client_id]
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    priority_id: {type: string, format: uuid}
                    status_id: {type: string, format: uuid}
                    client_phone: {type: string}
                    updated_at: {type: string, format: date-time}
                    type_id: {type: string, format: uuid}
                    client_tax_id: {type: string}
                    created_at: {type: string, format: date-time}
                    application_number: {type: integer}
                    ekb_client_id: {type: string, format: uuid}
                    client_name: {type: string}
