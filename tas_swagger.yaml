  /action_types:
    get:
      summary: Get Action Types
      description: Отримує список типів дій для ордерів з можливістю фільтрації за типом заявки та групою навичок. Повертає масив типів дій з інформацією про код, назву, опис, групу навичок та тип заявки. Використовується для відображення доступних дій при створенні ордерів.
      tags: [API/Applications]
      parameters:
      - name: type_id
        in: query
        description: ''
        required: false
        schema: {type: string}
      - name: skill_group_id
        in: query
        description: ''
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    skill_group_name: {type: string}
                    type_name: {type: string}
                    code: {type: string}
                    is_active: {type: string}
                    skill_group_id: {type: string, format: uuid}
                    type_id: {type: string, format: uuid}
                    name: {type: string}
                    description: {type: string}
                    sort_order: {type: integer}
                    type_code: {type: string}
                    skill_group_code: {type: string}
              example:
